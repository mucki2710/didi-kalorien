name: Didi auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Alternative App bereitstellen
        run: mkdir -p public/alternative && cp -R alternative/. public/alternative/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
