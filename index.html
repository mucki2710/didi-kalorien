<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Didi Kalorien</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #172033;
      --muted: #7b8495;
      --primary: #22a06b;
      --primary-dark: #168456;
      --border: #e8eaf0;
      --danger: #d94c4c;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 16px 110px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin-bottom: 4px;
      font-size: 28px;
    }

    .date {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 5px 25px rgba(20, 30, 50, 0.06);
    }

    .calorie-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 12px;
    }

    .calorie-number {
      font-size: 32px;
      font-weight: 750;
    }

    .goal {
      color: var(--muted);
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #e9edf0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: inherit;
      transition: width .3s;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .macro {
      background: #f7f8fa;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .macro strong {
      display: block;
      font-size: 17px;
    }

    .macro span {
      color: var(--muted);
      font-size: 12px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meal {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .meal:last-child {
      border-bottom: 0;
    }

    .meal small {
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 15px 0;
    }

    .camera-button {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 32px), 488px);
      border: 0;
      background: var(--primary);
      color: white;
      border-radius: 18px;
      padding: 17px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(34, 160, 107, .3);
    }

    .camera-button:hover {
      background: var(--primary-dark);
    }

    #photoInput {
      display: none;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    .analysis {
      display: none;
    }

    .food-row {
      display: grid;
      grid-template-columns: 1fr 75px 85px;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      font: inherit;
    }

    .food-kcal {
      text-align: right;
      font-weight: 650;
    }

    .analysis-total {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 20px;
      font-weight: 750;
    }

    .save-button {
      width: 100%;
      border: 0;
      background: var(--text);
      color: white;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      margin-top: 16px;
      cursor: pointer;
    }

    .status {
      display: none;
      text-align: center;
      padding: 18px;
      color: var(--muted);
    }

    .delete {
      border: 0;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <h1>🥗 Didi</h1>
    <div class="date" id="date"></div>
  </header>

  <section class="card">
    <div class="calorie-row">
      <div>
        <div class="calorie-number">
          <span id="totalCalories">0</span>
          <small>kcal</small>
        </div>
        <div class="goal">von 2.200 kcal</div>
      </div>

      <strong id="remaining">2.200 übrig</strong>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="macro-grid">
      <div class="macro">
        <strong id="protein">0 g</strong>
        <span>Protein</span>
      </div>

      <div class="macro">
        <strong id="carbs">0 g</strong>
        <span>Kohlenhydrate</span>
      </div>

      <div class="macro">
        <strong id="fat">0 g</strong>
        <span>Fett</span>
      </div>
    </div>
  </section>


  <section class="card">
    <div class="section-title">
      <h2>Heute</h2>
    </div>

    <div id="mealList"></div>
  </section>


  <section class="card analysis" id="analysisCard">

    <h2>Fotoanalyse</h2>

    <img id="preview" class="preview" alt="Mahlzeit">

    <div class="status" id="status">
      🔍 Mahlzeit wird analysiert …
    </div>

    <div id="result">
      <p>
        Erkannte Lebensmittel und geschätzte Mengen.
        Du kannst die Grammangaben korrigieren.
      </p>

      <div id="foodList"></div>

      <div class="analysis-total">
        <span>Gesamt</span>
        <span id="analysisCalories">0 kcal</span>
      </div>

      <button class="save-button" onclick="saveMeal()">
        Mahlzeit speichern
      </button>
    </div>

  </section>

</div>


<input
  type="file"
  id="photoInput"
  accept="image/*"
  capture="environment"
/>

<button class="camera-button" onclick="openCamera()">
  📷 Mahlzeit fotografieren
</button>


<script>
const DAILY_GOAL = 2200;

let currentFoods = [];

let meals = JSON.parse(
  localStorage.getItem("didi-meals") || "[]"
);


// ------------------------------------
// Datum
// ------------------------------------

const dateFormatter = new Intl.DateTimeFormat("de-DE", {
  weekday: "long",
  day: "numeric",
  month: "long"
});

document.getElementById("date").textContent =
  dateFormatter.format(new Date());


// ------------------------------------
// Kamera
// ------------------------------------

function openCamera() {
  document.getElementById("photoInput").click();
}


document
  .getElementById("photoInput")
  .addEventListener("change", handlePhoto);


function handlePhoto(event) {

  const file = event.target.files[0];

  if (!file) return;

  const preview = document.getElementById("preview");
  const analysisCard = document.getElementById("analysisCard");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  analysisCard.style.display = "block";

  status.style.display = "block";
  result.style.display = "none";

  analysisCard.scrollIntoView({
    behavior: "smooth"
  });


  // --------------------------------
  // MOCK-KI
  // später durch API ersetzen
  // --------------------------------

  setTimeout(() => {

    currentFoods = [
      {
        name: "Hähnchenbrust",
        grams: 160,
        kcal100: 165,
        protein100: 31,
        carbs100: 0,
        fat100: 3.6
      },
      {
        name: "Reis, gekocht",
        grams: 220,
        kcal100: 130,
        protein100: 2.7,
        carbs100: 28,
        fat100: 0.3
      },
      {
        name: "Brokkoli",
        grams: 100,
        kcal100: 35,
        protein100: 2.4,
        carbs100: 7,
        fat100: 0.4
      },
      {
        name: "Sauce",
        grams: 40,
        kcal100: 200,
        protein100: 2,
        carbs100: 8,
        fat100: 17
      }
    ];

    status.style.display = "none";
    result.style.display = "block";

    renderFoods();

  }, 1300);
}


// ------------------------------------
// Lebensmittel anzeigen
// ------------------------------------

function renderFoods() {

  const list = document.getElementById("foodList");

  list.innerHTML = "";

  currentFoods.forEach((food, index) => {

    const calories =
      Math.round(food.grams * food.kcal100 / 100);

    const row = document.createElement("div");

    row.className = "food-row";

    row.innerHTML = `
      <div>${food.name}</div>

      <div>
        <input
          type="number"
          min="0"
          value="${food.grams}"
          onchange="changeGrams(${index}, this.value)"
        >
      </div>

      <div class="food-kcal">
        ${calories} kcal
      </div>
    `;

    list.appendChild(row);

  });

  updateAnalysisTotal();
}


function changeGrams(index, grams) {

  currentFoods[index].grams =
    Math.max(0, Number(grams));

  renderFoods();
}


// ------------------------------------
// Analyse berechnen
// ------------------------------------

function calculateFood(food) {

  const factor = food.grams / 100;

  return {
    calories: food.kcal100 * factor,
    protein: food.protein100 * factor,
    carbs: food.carbs100 * factor,
    fat: food.fat100 * factor
  };
}


function getAnalysisTotals() {

  return currentFoods.reduce((total, food) => {

    const values = calculateFood(food);

    total.calories += values.calories;
    total.protein += values.protein;
    total.carbs += values.carbs;
    total.fat += values.fat;

    return total;

  }, {
    calories: 0,
    protein: 0,
    carbs: 0,
    fat: 0
  });
}


function updateAnalysisTotal() {

  const totals = getAnalysisTotals();

  document.getElementById("analysisCalories")
    .textContent =
    Math.round(totals.calories) + " kcal";
}


// ------------------------------------
// Mahlzeit speichern
// ------------------------------------

function saveMeal() {

  const totals = getAnalysisTotals();

  const meal = {
    id: Date.now(),
    date: new Date().toISOString().slice(0, 10),

    title: currentFoods
      .slice(0, 2)
      .map(food => food.name)
      .join(" + "),

    foods: currentFoods,

    calories: Math.round(totals.calories),
    protein: Math.round(totals.protein),
    carbs: Math.round(totals.carbs),
    fat: Math.round(totals.fat)
  };

  meals.push(meal);

  save();

  currentFoods = [];

  document.getElementById("analysisCard")
    .style.display = "none";

  document.getElementById("photoInput")
    .value = "";

  renderDashboard();
}


// ------------------------------------
// Löschen
// ------------------------------------

function deleteMeal(id) {

  meals = meals.filter(meal => meal.id !== id);

  save();

  renderDashboard();
}


// ------------------------------------
// LocalStorage
// ------------------------------------

function save() {

  localStorage.setItem(
    "didi-meals",
    JSON.stringify(meals)
  );
}


// ------------------------------------
// Dashboard
// ------------------------------------

function renderDashboard() {

  const today =
    new Date().toISOString().slice(0, 10);

  const todayMeals =
    meals.filter(meal => meal.date === today);


  const totals = todayMeals.reduce((sum, meal) => {

    sum.calories += meal.calories;
    sum.protein += meal.protein;
    sum.carbs += meal.carbs;
    sum.fat += meal.fat;

    return sum;

  }, {
    calories: 0,
    protein: 0,
    carbs: 0,
    fat: 0
  });


  document.getElementById("totalCalories")
    .textContent = totals.calories.toLocaleString("de-DE");

  document.getElementById("remaining")
    .textContent =
    Math.max(0, DAILY_GOAL - totals.calories)
      .toLocaleString("de-DE")
    + " übrig";

  document.getElementById("protein")
    .textContent = Math.round(totals.protein) + " g";

  document.getElementById("carbs")
    .textContent = Math.round(totals.carbs) + " g";

  document.getElementById("fat")
    .textContent = Math.round(totals.fat) + " g";


  const progress =
    Math.min(100, totals.calories / DAILY_GOAL * 100);

  document.getElementById("progressBar")
    .style.width = progress + "%";


  // Mahlzeiten

  const list =
    document.getElementById("mealList");

  if (todayMeals.length === 0) {

    list.innerHTML =
      `<div class="empty">
        Noch keine Mahlzeit erfasst.
      </div>`;

    return;
  }


  list.innerHTML = "";

  todayMeals
    .slice()
    .reverse()
    .forEach(meal => {

      const div =
        document.createElement("div");

      div.className = "meal";

      div.innerHTML = `
        <div>
          <strong>${meal.title}</strong><br>
          <small>
            ${meal.protein} g Protein ·
            ${meal.carbs} g KH ·
            ${meal.fat} g Fett
          </small>
        </div>

        <div>
          <strong>${meal.calories} kcal</strong>

          <button
            class="delete"
            onclick="deleteMeal(${meal.id})"
            aria-label="Mahlzeit löschen"
          >
            ×
          </button>
        </div>
      `;

      list.appendChild(div);
    });
}


renderDashboard();

</script>

</body>
</html>
